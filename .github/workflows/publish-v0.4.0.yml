name: Publish Voice Phone v0.4.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phone-mod
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Verify Minecraft and mod versions and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.4.0' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          gradle clean build --no-daemon
          test -s build/libs/voicephone-fabric-26.3-0.4.0.jar
      - name: Generate release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/libs/voicephone-fabric-26.3-0.4.0.jar release-assets/
          cd release-assets
          sha256sum voicephone-fabric-26.3-0.4.0.jar > voicephone-fabric-26.3-0.4.0.jar.sha256
      - name: Publish GitHub v0.4.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.4.0 Release is already published. Not overwriting release files.'
            exit 1
          fi
          gh release create v0.4.0 \
            release-assets/voicephone-fabric-26.3-0.4.0.jar \
            release-assets/voicephone-fabric-26.3-0.4.0.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voice Phone v0.4.0" \
            --notes "Minecraft Java 26.3 / Fabric / Simple Voice Chat. Incoming calls can be answered with the phone in inventory, showing a small modal popup when not holding the phone or a full-screen call UI when held. Adds a client title-screen update button for checking GitHub Releases from the main menu, including before joining a singleplayer or multiplayer world. Both client and server need the correct mod version. In-game call UI and automatic update behavior still need real-world testing." \
            --latest
