name: Publish Voice Phone v0.5.1
on:
  push:
    paths:
      - '.github/workflows/publish-v0.5.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phone-mod
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Verify Minecraft and mod versions and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.5.1' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          gradle clean build --no-daemon
          test -s build/libs/voicephone-fabric-26.3-0.5.1.jar
      - name: Generate release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/libs/voicephone-fabric-26.3-0.5.1.jar release-assets/
          cd release-assets
          sha256sum voicephone-fabric-26.3-0.5.1.jar > voicephone-fabric-26.3-0.5.1.jar.sha256
      - name: Publish GitHub v0.5.1 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.5.1 Release is already published. Not overwriting release files.'
            exit 1
          fi
          gh release create v0.5.1 \
            release-assets/voicephone-fabric-26.3-0.5.1.jar \
            release-assets/voicephone-fabric-26.3-0.5.1.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voice Phone v0.5.1" \
            --notes "Minecraft Java 26.3 / Fabric / Simple Voice Chat. Fixes right-clicking the phone not opening its interface when the client received an idle-state open request. Explicit open requests now open the phone screen, including during a call to access the hang-up control. Incoming call popup, compact HUD and OPEN voice group behavior remain. Compilation is verified; in-game behavior still needs testing." \
            --latest
