name: Publish Voice Phone v0.5.2
on:
  push:
    paths:
      - '.github/workflows/publish-v0.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phone-mod
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Verify Minecraft and mod versions and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.5.2' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          gradle clean build --no-daemon
          test -s build/libs/voicephone-fabric-26.3-0.5.2.jar
      - name: Generate release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/libs/voicephone-fabric-26.3-0.5.2.jar release-assets/
          cd release-assets
          sha256sum voicephone-fabric-26.3-0.5.2.jar > voicephone-fabric-26.3-0.5.2.jar.sha256
      - name: Publish GitHub v0.5.2 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.5.2 Release is already published. Not overwriting release files.'
            exit 1
          fi
          gh release create v0.5.2 \
            release-assets/voicephone-fabric-26.3-0.5.2.jar \
            release-assets/voicephone-fabric-26.3-0.5.2.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voice Phone v0.5.2" \
            --notes "Minecraft Java 26.3 / Fabric / Simple Voice Chat. Adds a softly blurred Minecraft world background when the phone dialing UI opens, using the native menu blur effect and a light translucent overlay for legible controls. Blur follows the Minecraft menu-background blurriness setting. Incoming popup, compact call HUD, and previous fixes remain. Compiled successfully; the visual effect still requires in-game testing." \
            --latest
