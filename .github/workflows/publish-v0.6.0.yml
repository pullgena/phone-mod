name: Publish Voice Phone v0.6.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.6.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phone-mod
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Verify Minecraft and mod versions and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.6.0' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          gradle clean build --no-daemon
          test -s build/libs/voicephone-fabric-26.3-0.6.0.jar
      - name: Generate release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/libs/voicephone-fabric-26.3-0.6.0.jar release-assets/
          cd release-assets
          sha256sum voicephone-fabric-26.3-0.6.0.jar > voicephone-fabric-26.3-0.6.0.jar.sha256
      - name: Publish GitHub v0.6.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.6.0 Release is already published. Not overwriting release files.'
            exit 1
          fi
          gh release create v0.6.0 \
            release-assets/voicephone-fabric-26.3-0.6.0.jar \
            release-assets/voicephone-fabric-26.3-0.6.0.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voice Phone v0.6.0" \
            --notes "Minecraft Java 26.3 / Fabric / Simple Voice Chat. Refreshes the phone item texture with a 32x32 translucent-background teal/slate pixel-art mobile phone and upgrades the dialing interface to a soft mint-accented translucent card with a short 260ms fade/slide entrance. Keeps the existing menu blur, incoming popup, call HUD, OPEN voice group, networking and updater unchanged. Gradle build succeeded; the visual transition still needs in-game testing." \
            --latest
