name: Publish Voice Phone v0.3.0
on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phone-mod
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Verify version and build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mod_version=0.3.0' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          gradle clean build --no-daemon
          test -s build/libs/voicephone-fabric-26.3-0.3.0.jar
      - name: Prepare release download files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/libs/voicephone-fabric-26.3-0.3.0.jar release-assets/
          cd release-assets
          sha256sum voicephone-fabric-26.3-0.3.0.jar > voicephone-fabric-26.3-0.3.0.jar.sha256
      - name: Publish v0.3.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.3.0 Release already exists; refusing to overwrite published files.'
            exit 1
          fi
          gh release create v0.3.0 release-assets/voicephone-fabric-26.3-0.3.0.jar release-assets/voicephone-fabric-26.3-0.3.0.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Voice Phone v0.3.0' \
            --notes 'Minecraft Java 26.3 Fabric / Simple Voice Chat. Call UI now displays only the relevant call/answer/decline/hangup actions. Adds a server-side update staging and shutdown-apply mechanism for dedicated servers, including Pterodactyl (requires graceful stop and writable mods directory). Clients and servers must install the updated mod; automatic update behavior has not been fully tested in-game.' \
            --latest
